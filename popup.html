<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body {
        margin: 0;
        width: 220px;
        background: #000;
        color: #fff;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .wrap {
        padding: 16px;
    }

    .title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .label {
        font-size: 13px;
        color: #ccc;
    }

    .switch {
        position: relative;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        inset: 0;
        background: #444;
        border-radius: 22px;
        cursor: pointer;
        transition: background 0.15s;
    }

    .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 2px;
        top: 2px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.15s;
    }

    input:checked + .slider {
        background: #69b7ff;
    }

    input:checked + .slider::before {
        transform: translateX(18px);
    }

    .hint {
        margin-top: 10px;
        font-size: 11px;
        color: #888;
    }
</style>
</head>
<body>
    <div class="wrap">
        <div class="title">Canvas OLED Dark Mode</div>

        <div class="row">
            <span class="label" id="statusLabel">On</span>

            <label class="switch">
                <input type="checkbox" id="toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="hint" id="hint"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
